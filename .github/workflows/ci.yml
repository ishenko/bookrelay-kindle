name: CI

on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r relay/requirements.txt httpx
      - run: PYTHONPATH=relay python -m unittest discover -s relay/tests -v
      - run: python -m py_compile relay/bookrelay/*.py relay/bookrelay/source/*.py

  kindle-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y meson ninja-build pkg-config gcc libgtk2.0-dev libcurl4-openssl-dev libglib2.0-dev libgdk-pixbuf2.0-dev xvfb xauth fonts-dejavu-core
      - run: meson setup client/build client
      - run: meson compile -C client/build
      - run: python3 -m unittest discover -s client/tests -v
      - run: sh scripts/test-native-ui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-xvfb-screenshots
          path: dist/native-ui/*/*.png

  kindlehf-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KindleModding/kindle-sdk
          submodules: recursive
          path: kindle-sdk
      - run: |
          sudo apt-get update
          sudo apt-get install -y aria2 libarchive-dev meson ninja-build pkg-config python3 zlib1g-dev nettle-dev
      - name: Install kindlehf toolchain
        run: |
          wget -q https://github.com/KindleModding/koxtoolchain/releases/latest/download/kindlehf.tar.gz -O /tmp/kindlehf.tar.gz
          tar -xzf /tmp/kindlehf.tar.gz -C "$HOME"
      - name: Generate Kindle SDK sysroot
        run: sudo bash kindle-sdk/gen-sdk.sh kindlehf "$HOME/x-tools/arm-kindlehf-linux-gnueabihf"
      - name: Build and inspect kindlehf binary
        run: |
          meson setup client/build-kindlehf client --cross-file "$HOME/x-tools/arm-kindlehf-linux-gnueabihf/meson-crosscompile.txt"
          meson compile -C client/build-kindlehf
          file client/build-kindlehf/bookrelay-kindle
          readelf -h client/build-kindlehf/bookrelay-kindle | sed -n '1,24p'
          readelf -d client/build-kindlehf/bookrelay-kindle | grep -E 'NEEDED|INTERP'
      - name: Build kindlehf KPM artifact
        run: |
          python3 scripts/check-kpm.py
          python3 scripts/package-kpm.py --binary client/build-kindlehf/bookrelay-kindle --output dist/bookrelay-kindle-kindlehf.kpkg
          tar -tzf dist/bookrelay-kindle-kindlehf.kpkg
          (cd dist && sha256sum bookrelay-kindle-kindlehf.kpkg > bookrelay-kindle-kindlehf.kpkg.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: bookrelay-kindle-kindlehf
          path: |
            dist/bookrelay-kindle-kindlehf.kpkg
            dist/bookrelay-kindle-kindlehf.kpkg.sha256

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check-kpm.py
      - run: python scripts/test_check_kpm_repository.py
      - run: python scripts/check-kpm-repository.py
      - run: python -m json.tool packaging/kpm/manifest.json >/dev/null
      - run: python -m json.tool kpm/manifest.json >/dev/null
      - run: git diff --check
